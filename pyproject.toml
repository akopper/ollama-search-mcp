[project]
name = "ollama-search-mcp"
description = "MCP server exposing Ollama web search and web fetch as tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
version = "0.2.1"
authors = [
    { name = "Alexander Kopper", email = "code@knospi.com" }
]
keywords = [
    "ollama",
    "mcp",
    "model-context-protocol",
    "web-search",
    "web-fetch",
    "ai",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "ollama>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/akopper/ollama-search-mcp"
Repository = "https://github.com/akopper/ollama-search-mcp"
Issues = "https://github.com/akopper/ollama-search-mcp/issues"
Changelog = "https://github.com/akopper/ollama-search-mcp/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/ollama-search-mcp/"

[project.scripts]
ollama-search-mcp = "ollama_search_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_search_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".coverage",
    ".coverage.*",
    "htmlcov",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "ASYNC",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = ["FBT001"]

[tool.ruff.lint.isort]
known-first-party = ["ollama_search_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["ollama_search_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
