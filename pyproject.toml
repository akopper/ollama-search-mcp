[project]
name = "ollama-websearch-mcp"
description = "MCP server for Ollama web search and web fetch APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
version = "0.2.0"
authors = [
    { name = "Alexander Kopper", email = "code@knospi.com" }
]
urls = { Homepage = "https://github.com/akopper/ollama-websearch-mcp", Repository = "https://github.com/akopper/ollama-websearch-mcp" }
dependencies = [
    "mcp>=2.0.0,<3",
    "ollama>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-anyio",
    "pytest-httpserver",
    "ruff>=0.9.0",
    "httpx",
]

[project.scripts]
ollama-websearch-mcp = "ollama_websearch_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_websearch_mcp"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "ASYNC",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = ["FBT001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
